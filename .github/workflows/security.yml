name: Security

on:
  pull_request:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep

      - name: Run Semgrep OWASP and TypeScript rules
        run: semgrep scan --error --config p/owasp-top-ten --config p/typescript .

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  gitguardian:
    name: GitGuardian secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require GitGuardian secret
        run: |
          if [ -z "$GITGUARDIAN_API_KEY" ]; then
            echo "GITGUARDIAN_API_KEY must be configured as a GitHub Actions secret."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install ggshield
        run: python -m pip install --disable-pip-version-check ggshield

      - name: Scan repository for secrets
        run: ggshield secret scan repo .

  snyk:
    name: Snyk dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Require Snyk token
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "SNYK_TOKEN must be configured as a GitHub Actions secret."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Snyk
        run: pnpm dlx snyk test --all-projects --severity-threshold=high

  zap-staging:
    name: OWASP ZAP staging baseline
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require staging URL
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          if [ -z "$STAGING_BASE_URL" ]; then
            echo "STAGING_BASE_URL must be configured as a GitHub Actions repository variable."
            exit 1
          fi

      - name: Run ZAP baseline scan
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          docker run --rm --network host ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "$STAGING_BASE_URL" -I
